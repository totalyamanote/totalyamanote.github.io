# ブランチ上での試運転（main には書かない）：Yahoo!ボタンの自動追加を APIキー付きで実行し、同じブランチにコミットする。
# claude/** ブランチへの push でだけ動く。main に取り込む前に削除する。
name: malls-preview

on:
  push:
    branches: ["claude/**"]
    paths:
      - "bot/add_malls.py"
      - "bot/yahoo.py"
      - ".github/workflows/malls-preview.yml"

permissions:
  contents: write

concurrency:
  group: malls-preview
  cancel-in-progress: true

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Add Yahoo buttons (preview)
        env:
          TZ: Asia/Tokyo
          RAKUTEN_APP_ID: ${{ secrets.RAKUTEN_APP_ID }}
          RAKUTEN_ACCESS_KEY: ${{ secrets.RAKUTEN_ACCESS_KEY }}
          RAKUTEN_AFFILIATE_ID: ${{ secrets.RAKUTEN_AFFILIATE_ID }}
          YAHOO_APP_ID: ${{ secrets.YAHOO_APP_ID }}
          SITE_DIR: .
          DATA_DIR: bot/data
          MALLS_MAX_LOOKUPS: "400"
        run: python bot/add_malls.py
      - name: Commit to this branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A articles bot/data/mall_map.json
          if git diff --cached --quiet; then echo "変更なし"; exit 0; fi
          git commit -qm "preview: Yahoo!ボタンを自動追加（試運転）"
          git pull --rebase -q origin "${GITHUB_REF_NAME}" && git push -q origin "HEAD:${GITHUB_REF_NAME}"
